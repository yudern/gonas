    <div class="brand">
      <span class="brand-mark">◇</span>
      <span class="brand-name">GoNAS</span>

    <ul class="nav-list">

      <div id="sidebar-user" class="sidebar-user" hidden></div>
      <select id="lang-switcher" class="lang-switcher" aria-label="Language / 語言 / 语言">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>

      <button class="secondary logout-btn" id="logout-btn" type="button">登出</button>

  <main class="content" id="content">
