name: CI

# 這支 CI 存在的理由:前十輪 build/appliance/ 的覆閱裡,好幾個真的存在
# 的 bug(POSIX 子行程變數作用域、grub "---" 注入規則、架構偵測 fallback
# 命名不一致……)都是靠人工在一個開發沙盒裡手動跑 `sh -n`/`go vet`/
# `go test`/`test-boot-menu-patch.sh` 才抓到的——這些檢查全部不需要
# 網路、也不需要真的建置 ISO,理論上每一次 push/PR 都應該自動跑一次,
# 而不是依賴「有沒有人記得手動跑」。這支 workflow 就是把那套手動流程
# 固定下來。
#
# 刻意不涵蓋的東西:真正下載 Debian ISO、跑 xorriso 建置、進 QEMU
# 開機測試——那些需要的網路存取/建置時間跟 GitHub Actions 一般 runner
# 的預設環境不完全匹配,而且不是這個專案目前最需要自動化的部分(目前
# 最需要的是「不要讓已經抓到過的那類 bug 悄悄回歸」),真正的端到端
# ISO 驗證仍然照 docs/APPLIANCE_BUILD_AND_TEST_PROCEDURE.md 手動做。

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  go:
    name: Go build / vet / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt(檢查有沒有沒格式化過的檔案)
        run: |
          UNFORMATTED="$(gofmt -l -s .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "以下檔案沒有用 'gofmt -s -w' 格式化過:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test(含 -race)
        run: go test ./... -race -count=1

  appliance-shell:
    name: build/appliance/ shell 腳本檢查(不需要網路)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sh -n(POSIX 語法檢查所有 build/ 底下的 shell 腳本)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! sh -n "$f"; then
              echo "語法錯誤: $f"
              status=1
            fi
          done < <(find build -type f -name '*.sh' -print0)
          exit $status

      - name: test-boot-menu-patch.sh(開機選單參數注入邏輯的離線回歸測試)
        run: sh build/appliance/test-boot-menu-patch.sh

      - name: test-gpg-verify.sh(GPG 簽章驗證邏輯的離線回歸測試——含真的用一把臨時金鑰簽章/驗證,ubuntu-latest 預裝 gpg 所以這裡不會被跳過)
        run: sh build/appliance/test-gpg-verify.sh

      - name: test-detect-arch.sh(late-command.sh 架構偵測 fallback 對應表的離線回歸測試)
        run: sh build/appliance/test-detect-arch.sh

      - name: test-portable-checksum.sh(sha256sum/md5sum 在沒有 GNU coreutils 環境下 fallback 邏輯的離線回歸測試)
        run: sh build/appliance/test-portable-checksum.sh

      - name: test-portable-sed.sh(sed -i 跨 GNU/BSD 相容包裝邏輯的離線回歸測試)
        run: sh build/appliance/test-portable-sed.sh

      - name: test-find-boot-menu-cfgs.sh(find 多個起始路徑、其中一個不存在時,在 set -e 底下不能讓腳本沉默死掉的離線回歸測試)
        run: sh build/appliance/test-find-boot-menu-cfgs.sh

  # 第十七輪覆閱抓到的問題:build-iso.sh 跟 lib/patch-boot-menu.sh 原本
  # 直接呼叫 `sed -i`/`sha256sum`/`md5sum`,這些是 GNU coreutils 工具,
  # 在 ubuntu-latest 這種 Linux runner 上到處都有,完全不會暴露這個問題
  # ——這個問題是使用者實際要在自己的 macOS 機器上執行這支腳本時才發現
  # 的,前面 16 輪 CI 設定都只在 Linux runner 上跑,從來沒有機會真的
  # 驗證過 macOS 相容性修正(lib/portable-sed.sh、
  # lib/portable-checksum.sh)有沒有真的在一台真正的 macOS 機器、真正
  # 的 BSD sed/shasum/md5 底下正確運作。GitHub Actions 剛好提供
  # macos-latest 這種 runner,讓這件事第一次不用靠人工在自己的 Mac 上
  # 手動確認——這支 job 完全複用跟 appliance-shell 一樣的離線測試腳本,
  # 差別只在 runs-on,任何一次修改弄壞了 macOS 相容性(例如不小心又
  # 加了一個假設 GNU coreutils 一定存在的呼叫),這裡就會直接紅燈,不用
  # 等到有人真的在 Mac 上手動跑才發現。
  appliance-shell-macos:
    name: build/appliance/ shell 腳本檢查(macOS/BSD 環境,不需要網路)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: sh -n(POSIX 語法檢查所有 build/ 底下的 shell 腳本)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! sh -n "$f"; then
              echo "語法錯誤: $f"
              status=1
            fi
          done < <(find build -type f -name '*.sh' -print0)
          exit $status

      - name: test-boot-menu-patch.sh(在真正的 BSD sed 底下驗證 gonas_sed_inplace 沒有壞掉)
        run: sh build/appliance/test-boot-menu-patch.sh

      - name: test-gpg-verify.sh(這個 runner 上如果沒裝 gpg,案例 4/5 會自動 SKIP,不影響整體通過)
        run: sh build/appliance/test-gpg-verify.sh

      - name: test-detect-arch.sh
        run: sh build/appliance/test-detect-arch.sh

      - name: test-portable-checksum.sh(在真正沒有 GNU coreutils 的環境下,驗證真的會 fallback 到 shasum/md5 而不是假設 sha256sum/md5sum 存在)
        run: sh build/appliance/test-portable-checksum.sh

      - name: test-portable-sed.sh(在真正的 BSD sed 底下驗證 -i.bak 這個寫法真的可行)
        run: sh build/appliance/test-portable-sed.sh

      - name: test-find-boot-menu-cfgs.sh(macOS 的 BSD find 底下驗證同一個 set -e 陷阱也不會發生)
        run: sh build/appliance/test-find-boot-menu-cfgs.sh
