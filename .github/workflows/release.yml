# GoNAS 自動發布流程。
#
# 觸發:推一個 `v*` 版本 tag(例如 `git tag v0.1.0 && git push origin v0.1.0`),
# 或到 Actions 頁面手動按 Run(workflow_dispatch)。
#
# 做兩件本機/開發沙盒不方便做、但 GitHub 的 runner 很適合做的事:
#   1) build-tarballs:交叉編譯 amd64/arm64/armv7 三份靜態執行檔,打包成
#      release tarball,建立對應版本的 GitHub Release 並掛上去。
#   2) build-iso:安裝 xorriso/wget,下載官方 Debian DVD-1、用 build-iso.sh
#      重新包裝成「插上就自動裝好 GoNAS」的 amd64/arm64 開機映像檔,掛到
#      同一個 Release。ISO 這步需要 ~3.7GB 下載 + xorriso + 約 12GB 磁碟——
#      這正是開發沙盒做不到(出口擋 deb.debian.org、沒有 xorriso)、而
#      ubuntu-latest runner 天生具備的環境。
#
# 誠實邊界(跟 docs/REAL_HARDWARE_TESTING.md 一致):CI 只能「建出」ISO,
# 不能「開機驗證」它。DVD-1 pkgsel 離線安裝 openssh-server/sudo 那段,仍需
# 你在真的 ESXi/實體機或 QEMU 裡開機跑一次才算數。CI 產出的 ISO 是給你拿去
# 做那個驗證的,不是「CI 綠燈 = 保證能裝」。

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手動觸發時要用的版號(例如 v0.1.0);留空則用 git describe"
        required: false
        default: ""

# gh release create / upload 需要寫入 repo 內容(建立 Release、掛附件)。
permissions:
  contents: write

jobs:
  build-tarballs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout(含完整歷史與 tag,make 的 git describe 才拿得到版號)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: 發布閘門 — gofmt / vet / test
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt 有未格式化的檔案:"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./... -count=1

      - name: 交叉編譯三架構 + 打包 release tarball
        run: make release

      - name: 建立(或沿用)本版 Release 並掛上 tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # tag 觸發用 tag 名;手動觸發用輸入值,沒填就退回 git describe。
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF}" in
              refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
              *) VERSION="$(git describe --tags --always)" ;;
            esac
          fi
          echo "release version: $VERSION"
          # Release 不存在才建;已存在(例如 iso job 先建了)就沿用。
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "GoNAS $VERSION" \
              --notes "自動建置於 GitHub Actions。內含 amd64/arm64/armv7 tarball 與 amd64/arm64 開機即用 ISO。ISO 仍需在真機/QEMU 開機驗證安裝流程,見 docs/REAL_HARDWARE_TESTING.md。"
          fi
          gh release upload "$VERSION" dist/release/*.tar.gz --clobber

  build-iso:
    needs: build-tarballs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 一次只建一個架構,建完 amd64 再建 arm64——不要兩個同時搶頻寬/磁碟,
      # 降低大檔下載被砍斷的機率(使用者要求)。
      max-parallel: 1
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout(含完整歷史與 tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: 安裝 ISO 重新包裝工具(xorriso / wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso wget

      - name: 清出磁碟空間 + 準備大容量工作碟
        run: |
          # 只清跟 Go 無關的大型 SDK 換系統碟空間。
          # 絕對不要動 /opt/hostedtoolcache / $AGENT_TOOLSDIRECTORY——那是
          # 上一步 Setup Go 裝 Go 的地方,砍掉會讓後面 make 的 go build
          # 直接 "go: not found"(這正是上一次 CI 失敗的真正原因)。
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          # 真正的重活(DVD-1 3.7GB × 下載/解開/重包多份)都指到 /mnt 大碟,
          # 不靠系統碟,所以這裡清多清少其實都夠用。
          sudo mkdir -p /mnt/isowork
          sudo chown "$(id -u):$(id -g)" /mnt/isowork
          echo "=== go 還在不在(應印出路徑)===" && command -v go && go version
          echo "=== 系統碟 / 與大容量碟 /mnt 目前狀況 ===" && df -h / /mnt

      - name: 建置 ${{ matrix.arch }} 開機即用 ISO
        env:
          # 工作目錄搬到 /mnt(大碟);CI 是用完即丟,跳過那份沒必要、又多佔
          # 3.7GB 系統碟的本地快取複製。見 build/appliance/build-iso.sh。
          GONAS_ISO_WORK_ROOT: /mnt/isowork
          GONAS_ISO_NO_CACHE: "1"
        run: |
          make iso-${{ matrix.arch }}
          echo "=== 建置後磁碟狀況 ==="
          df -h / /mnt

      - name: 切成 <2GiB 分割檔並掛到本版 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "${GITHUB_REF}" in
              refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
              *) VERSION="$(git describe --tags --always)" ;;
            esac
          fi
          cd dist/release
          ISO="$(ls gonas-*-${{ matrix.arch }}.iso)"
          echo "ISO 大小:$(ls -lh "$ISO" | awk '{print $5}')"

          # GitHub Release 單檔上限 2GiB,DVD-1 based ISO ~3.7GB 超過,
          # 所以切成每塊 1900MiB(<2GiB)的分割檔。GNU split 的後綴是
          # .part-aa / .part-ab …,照字母排序,合併時 `cat *` 順序正確。
          split -b 1900M -d -a 2 "$ISO" "$ISO.part-"

          # 產一份「如何合併 + 校驗」的說明,一起掛上去(用 printf 避免
          # heredoc 在 YAML 縮排下的相容問題)。
          WHOLE_SHA="$(cut -d' ' -f1 "$ISO.sha256")"
          printf '%s\n' \
            "這份 ISO 因為超過 GitHub Release 單檔 2GiB 上限,被切成多個 .part-NN 分割檔。" \
            "下載「全部」的 ${ISO}.part-* 之後,在同一個資料夾執行:" \
            "" \
            "  cat ${ISO}.part-* > ${ISO}        # macOS / Linux 都適用" \
            "" \
            "合併後校驗,要跟這個 SHA256 一致:" \
            "  ${WHOLE_SHA}" \
            "  # macOS: shasum -a 256 ${ISO}" \
            "  # Linux: sha256sum ${ISO}" \
            "" \
            "校驗一致就可以拿 ${ISO} 去 ESXi/實體機安裝了。" \
            > "$ISO.HOWTO.txt"

          echo "=== 產出的分割檔 ===" && ls -lh "$ISO".part-* "$ISO.sha256" "$ISO.HOWTO.txt"

          # 掛上 Release:分割檔 + 全檔 SHA256 + 合併說明(都遠小於 2GiB)。
          gh release upload "$VERSION" \
            "$ISO".part-* \
            "$ISO.sha256" \
            "$ISO.HOWTO.txt" \
            --clobber
