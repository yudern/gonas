# preseed.cfg — 自動化 Debian 安裝程式的問答，把「開機 → 幾乎全自動
# 裝好一台 GoNAS」的流程串起來。這份檔案依照 Debian 官方
# Installation Guide 附錄 B（Automating the installation using
# preseeding）撰寫，邏輯上自洽，但這個開發沙盒完全沒有能力執行真正的
# debian-installer 環境來驗證它（見 build/appliance/README.md 的完整
# 說明）——正式用在真實硬體之前，請務必先在 QEMU/VirtualBox 裡完整跑
# 過一次安裝流程。
#
# 設計取捨：這份 preseed 刻意只自動化「裝好一個可開機、可以跑 gonasd
# 的最小 Debian 基礎系統 + SSH/sudo」這一段，不嘗試在安裝過程順便裝
# mergerfs/snapraid/samba/docker.io 這些 GoNAS 的「選用」外部相依套件。
# 第二十八輪換成 DVD-1 完整版之後,openssh-server / sudo 這種主流套件
# 光碟上就有、離線裝得起來(見下面 pkgsel/include);但 mergerfs /
# snapraid / docker.io 這些冷門套件「不保證」在 DVD-1 上,所以它們刻意
# 不在「安裝階段」裝(那一步只能用 DVD 當來源)。這也跟 GoNAS 本身的設計
# 哲學一致：internal/doctor 套件從來不會自動安裝任何外部相依套件（見該
# 套件文件），一律是使用者自己決定何時、要不要裝——appliance 映像檔延續
# 同一個原則，只是把「裝 gonasd 本體 + 一定會用到的 SSH/sudo」這幾步
# 自動化掉。使用者開完機之後，在 Web 介面 Doctor 頁面點「安裝」就能補裝。
# 第五十八輪(使用者:「這幾個軟件你為什麼還需要聯網你不做成離線安裝的?」)
# 起,這些 DVD 上沒有的選用套件改成「建置期就打包進 ISO」:build-iso.sh
# 第 4.8 節在 Mac(有網路)上把它們連同相依封閉集下載進 gonas/debs/,
# late-command.sh 3.6 節再把它設成本機 file:// apt 來源——所以開機後
# 「不需要網路」就能從 Web Doctor 離線裝好;有網路時 apt 也照樣能走網路
# 補裝/更新(使用者要的「兩者都要」)。見 README.md 的「軟體版 vs. 映像檔」。

### 語系與鍵盤 —— 給一個合理的預設值（英文＋美式鍵盤），使用者可以在
### 開機之後透過 `dpkg-reconfigure locales`/`localectl` 自行調整，不需要
### 為了「支援所有語系」而讓安裝程式在這一步停下來詢問。
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
### 第十九輪覆閱(全面排查「除了選硬碟+必要確認,其餘全自動」這個原始
### 目標)補上的防禦性設定:明確關掉「要不要自動偵測鍵盤配置」這一題,
### 避免某些情況下安裝程式在鍵盤這一步停下來要人按鍵測試。
d-i console-setup/ask_detect boolean false

### 網路 —— 全部走 DHCP 自動設定，不詢問任何網路相關問題。裝機當下
### 通常還沒有機會先設定固定 IP（GoNAS 本身的網路設定不歸這裡管，
### 這裡只負責「先讓機器連上區網、能被瀏覽器連到」這一件事）。
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string gonas
d-i netcfg/get_domain string unassigned-domain
d-i netcfg/wireless_wep string

### 套件來源 —— 只用光碟/USB 媒體本身內附的套件，完全不詢問、也不
### 使用網路上的套件鏡像，這是整個「離線安裝」設計的關鍵一步。
d-i mirror/country string manual
d-i apt-setup/use_mirror boolean false
### 第十八輪覆閱(使用者實測 arm64 安裝)才抓到的問題:這裡原本寫的是
### `boolean true`,語意剛好相反——`apt-setup/cdrom/set-first` 這個
### debconf 問題問的是「要不要在用完第一片光碟/USB 媒體之後，繼續
### 問使用者要不要插入第二片來掃描更多套件」,`true` 代表「要」,所以
### 即使 preseed 已經用 `priority=high` 蓋掉大多數問題,安裝到「設定
### 套件管理員」這一步時還是會真的跳出
### 「The image with the following label has already been scanned:
### ... Scan extra installation media?」這個對話框，要求使用者手動
### 選 `<No>` 才能繼續——這台機器只有一份安裝媒體，根本沒有「第二片」
### 這回事，這一步從來就不應該真的需要人工介入。已對照
### mail-archive.com 上 Debian 官方 bugs.debian.org #992183(修正
### installation-guide 裡 example-preseed.txt 缺漏這一行的討論)確認
### 正確答案是 `boolean false`——「不要」再繼續問要不要掃描更多媒體。
d-i apt-setup/cdrom/set-first boolean false
### 第十九輪覆閱補上的防禦性設定:除了上面那個「掃描第一片額外媒體」的
### 問題,apt-setup 還有「掃描下一片媒體」(set-next)跟舊版的「要不要
### 掃描另一片 CD/DVD」(another)兩個同類問題——這台機器永遠只有一份
### 安裝媒體,這三個一律設 false,確保「設定套件管理員」這一步在任何
### 情況下都不會停下來要人手動選,對齊「除了選硬碟+必要確認其餘全自動」
### 的目標。
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/another boolean false
popularity-contest popularity-contest/participate boolean false

### 時區 —— 預設 UTC，一台 NAS daemon 內部一律用 UTC 記錄時間最不容易
### 出錯（見 internal/state 各處直接用 time.Now() 的慣例），使用者事後
### 可以用 `timedatectl set-timezone` 調整純粹給人看的顯示時區。
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### 磁碟分割 —— 這是整份 preseed 裡「最需要謹慎」的一段：guided 分割
### 預設仍然會在真正動手改磁碟前跳出一個確認畫面（`partman/confirm*`
### 這幾行故意不預先設成 true），刻意保留這一步需要使用者手動按下
### 確認，而不是完全靜默地清空使用者選到的磁碟——這台機器上通常還會
### 另外接資料碟/同位碟給 GoNAS 的儲存陣列用（那些完全不歸這裡管，
### 陣列設定在 GoNAS 自己的 Web 介面），裝系統的這顆碟才是這裡要處理
### 的對象,選錯碟不可逆地清空使用者的資料陣列會是非常嚴重的後果，
### 所以寧可多一步手動確認。
### 重要:這台機器如果偵測到「不只一顆」磁碟(典型 NAS 機器的正常
### 狀況——系統碟之外通常還有資料碟/同位碟),guided partitioning
### 預設也會停下來問「要對哪一顆磁碟分割」(這裡故意沒有設定
### `partman-auto/disk`,所以沒辦法自動略過這一題)——這是刻意的,
### 跟下面故意留白的最終寫入確認是同一種考量:自動選錯磁碟去分割,
### 後果可能是清空 GoNAS 陣列用的資料碟,寧可讓安裝程式在這裡多停
### 一次要人工選擇,也不要用「猜」的方式自動選第一顆偵測到的磁碟。
### 只有一顆磁碟的機器(例如先在 VM 裡只掛一顆測試碟)才會完全不停
### 在這一題。
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
# 下面幾行刻意保持註解、不啟用,見上面的說明,讓安裝程式在真正寫入
# 磁碟前停下來要求手動確認。`partman/confirm` 是「要不要把上面選好的
# 分割配置寫入磁碟」這個核心問題本身(Debian 官方的全自動化 preseed
# 範例會把這一行打開,這裡刻意反過來留白);`partman/confirm_nooverwrite`
# 是「這顆磁碟上偵測到既有的分割區/資料,確定要覆蓋嗎」;
### `partman-md/confirm` 只有在用到軟體 RAID(mdadm)配置時才會被問到
### ——這裡用的 atomic recipe(全部塞進一個分割區,不含 RAID/LVM)
### 理論上不會觸發這一題,列在這裡純粹是保險,萬一之後改成別的
### recipe 也一樣不會被自動略過。
#d-i partman/confirm boolean true
#d-i partman/confirm_nooverwrite boolean true
#d-i partman-md/confirm boolean true

### 帳號 —— 不建立一般使用者、鎖定 root 直接登入密碼（跟 Debian Cloud
### 映像的慣例一致），改用一組帶 sudo 權限的維運帳號。帳號與密碼都是
### `gonas`(使用者要求的好記預設值),並在 late_command 執行完之後把
### 密碼標記為過期,強制第一次登入就得改密碼——這只是給「需要 SSH/
### 主控台進去排除硬體/網路層問題」用的緊急備援管道,不是 GoNAS 本身的
### 帳號系統(NAS 功能的登入帳號是 Web 介面自己的 admin/viewer 帳號,
### 見 internal/state.AdminAccount,兩者完全independent;Web 端也有一組
### 預設的 admin 帳密 gonas/gonas + 強制第一次改密碼,見 late-command.sh
### 1.8 節與 cmd/gonasd 的 -seed-default-admin)。
### 第十九輪覆閱:帳號名稱從原本的 gonasadmin 改成 gonas(使用者要求
### 「帳密都設成 gonas」),密碼從 gonas-change-me-now 改成 gonas;強制
### 第一次改密碼的機制(late-command.sh 的 chage -d 0)保留,所以 gonas
### 這組預設密碼只有第一次登入有效,登入後會被要求立刻改掉。
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string GoNAS Maintenance
d-i passwd/username string gonas
d-i passwd/user-password password gonas
d-i passwd/user-password-again password gonas
d-i passwd/user-default-groups string sudo
d-i user-setup/allow-password-weak boolean true

### 套件選擇 —— 不裝桌面環境,保持最小系統佔用空間;popularity-contest/
### 使用建議套件都關掉,減少安裝過程可能觸發的網路請求。
###
### 第十九輪(netinst 時代)這裡曾經是一個大坑:netinst 光碟只含 base
### 套件,`ssh-server` 工作集跟 `sudo` 都不在光碟裡,而 appliance 又設了
### `apt-setup/use_mirror false`(離線安裝),導致這兩個套件「離線裝不
### 起來」;當時的解法是自己在建置機器上把它們的 .deb 打包進 ISO、再
### 離線 dpkg -i(脆弱、踩過好幾個坑)。
###
### 第二十八輪(使用者決定)換成 DVD-1 完整版之後,這個矛盾根本消失:
### DVD-1 本身就是一個很大的離線套件庫,openssh-server / sudo 都在光碟
### 裡,安裝程式用官方的 `pkgsel/include` 就能在完全離線(use_mirror
### false)的情況下,直接從光碟把它們裝好——不需要再自己打包 .deb。
### 所以這裡:
###   - 用 `pkgsel/include` 明確指定要從 DVD 裝 openssh-server(遠端管理
###     的緊急備援管道)跟 sudo(gonas 帳號要用)。
###   - 保留 `standard`:標準系統工具集,DVD 上有,離線就裝得起來。
###
### !!! 重要(維護時務必遵守)!!! 這一行只能列「確定在 DVD-1 上的
### 套件」。pkgsel 在離線情況下遇到「光碟上找不到的套件」會讓套件安裝
### 這一步報錯——openssh-server / sudo 是 Debian 最主流的套件,一定在
### DVD-1 上,安全;但 GoNAS 的冷門相依(mergerfs / snapraid / docker.io
### 等)不保證在 DVD-1 上,**絕對不要**塞進這一行,那些一律留給使用者
### 開機、有網路之後再透過 Web 介面 Doctor 或 apt 安裝(見 late-command.sh
### 3.5 節會把 apt 來源改指向網路鏡像)。要擴充這一行前,先實際確認該
### 套件真的在 DVD-1 的套件庫裡。
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server sudo
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

### Bootloader —— 標準安裝到 MBR/EFI 系統分割區，不詢問要裝在哪顆碟
### （用剛剛選定的那顆系統碟）。`grub-installer/bootdev string default`
### 這一行是額外補上的:多顆磁碟的機器上,grub-installer 有時候會另外
### 問一次「開機程式要裝在哪個裝置」(這題理論上跟磁碟分割選的是同一顆
### 系統碟,但仍然是一個獨立的問題,沒有明確給答案的話在多碟機器上
### 可能又停一次)——`default` 是 Debian 官方文件建議的值，代表「讓
### grub-installer 自己根據剛剛分割的結果判斷」，不用另外指定實際的
### /dev/sdX 路徑。
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
### 第十九輪覆閱補上:在 UEFI 機器上(arm64 一定是 UEFI,很多 amd64
### 新機也是),額外把開機程式也裝到「可移除媒體」的標準路徑
### (\EFI\BOOT\bootaa64.efi / bootx64.efi)。兩個理由:(1) 有些韌體
### (包含部分虛擬機、以及不少實體 NAS/mini PC 的 UEFI)只會去找這個
### 標準路徑、不認安裝程式寫進 NVRAM 的開機項目,不設這個的話裝完可能
### 開不了機;(2) 這一題在某些情況下會跳出來問要不要這樣做,明確回答
### true 可以避免安裝停在這裡等人回答——對齊「除了選硬碟+必要確認其餘
### 全自動」的目標。設 true 沒有副作用(只是多寫一份開機檔到 ESP)。
d-i grub-installer/force-efi-extra-removable boolean true

### 韌體偵測 —— 官方 netinst ISO 本身不含非自由的韌體檔案(firmware
### blob),某些真實硬體的網卡/儲存控制器需要額外的韌體才能被完整
### 偵測到。如果不特別回答，安裝程式偵測到缺少韌體時預設會跳出「請
### 插入含韌體的另一份媒體」這個對話框等待使用者回應——這題在
### build-iso.sh 設定的 priority=high 底下究竟會不會被顯示、還是被
### 無聲跳過，這支 preseed 沒有把握，為了避免「安裝程式卡住等一份
### 不存在的韌體媒體」
### 這種最壞情況，這裡明確回答「不要」，讓安裝程式在真的缺韌體時
### 直接跳過(對應的網卡等硬體事後可能無法使用,不影響安裝流程本身
### 走完)——這是真實硬體上比 QEMU/VirtualBox(用 virtio,不需要額外
### 韌體)更需要留意的一個差異點,見 build/appliance/README.md。
d-i hw-detect/load_firmware boolean false

### 安裝完成 —— 不要停在「移除安裝媒體再按 Enter」那個畫面，裝完直接
### 重開機；重開機後 late-command.sh 已經在目標系統裡佈署完
### gonasd/主控台/品牌化，使用者看到的就是 GoNAS 開機畫面。
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true

### late_command —— 整個「這是 GoNAS，不是套了殼的 Debian」體驗的
### 關鍵一步，實際邏輯都在 build/appliance/late-command.sh（不是寫死
### 在這一行，方便維護跟做語法檢查），用 in-target 在剛裝好的目標
### 系統 chroot 裡執行。GONAS_INSTALL_MEDIA 讓 late-command.sh 知道
### 要去哪裡找 gonasd 的 release tarball跟 overlay 目錄，這兩個都是
### build-iso.sh 額外燒進 ISO 裡的檔案，不是官方 netinst ISO 本來就有
### 的內容。
###
### 刻意寫成 `sh /cdrom/gonas/late-command.sh`，而不是直接
### `/cdrom/gonas/late-command.sh`(靠檔案自己的 shebang + 執行位元被
### 觸發)——這是第十三輪覆閱抓到「build-iso.sh 忘記把 lib/ 目錄塞進
### ISO」那個 bug之後，回頭多想一步發現的另一個潛在風險:
### build-iso.sh 雖然對 late-command.sh 做了 `chmod +x`，但那個
### chmod 是對「準備要被 xorriso 打包進 ISO 的暫存目錄」裡的檔案做的，
### 真正決定這個執行位元能不能活著留在最終 ISO 9660 檔案系統上的,是
### xorriso 有沒有把 Rock Ridge 擴充屬性(存放 Unix 權限位元的機制)
### 正確套用在「這次新加進去的檔案」上——這支腳本是先載入官方 base.iso
### 再用 `-map` 疊加修改過的目錄樹，理論上會沿用 base.iso 本身既有的
### Rock Ridge 設定(Debian 官方 ISO 一定有開),但這件事到目前為止
### 完全沒有實際驗證過(這個開發沙盒裝不了 xorriso)。與其賭這個假設
### 一定成立、賭錯了會讓整支 late-command.sh 因為「Permission denied」
### 悄悄失敗(症狀跟前面 lib/ 沒塞進去那個 bug幾乎一模一樣:機器裝完
### 只是一台陽春 Debian，唯一的差別只有失敗訊息換成 motd 裡的
### permission denied，而不是原本忘記塞 lib/ 那次的 `.`: No such
### file or directory)，不如乾脆讓 late_command 這個進入點完全不
### 依賴執行位元有沒有被保留下來——用 `sh 檔案路徑` 明確指定直譯器
### 執行，只需要這個檔案「讀得到」，不需要它「可執行」，兩種情況下
### 都能正常跑。
### 第二十三輪(使用者實測:amd64 + ESXi,late-command.sh 真的失敗了一次,
### 照這裡原本寫的「見 /var/log/syslog」去找,結果 Debian 13 這台裝好的
### 目標系統上根本沒有 /var/log/syslog 這個檔案——現在的 Debian 預設
### 只有 journald,不會自動裝 rsyslog 去把訊息寫成傳統的 syslog 純文字
### 檔。而且就算裝了 rsyslog,late-command.sh 是在安裝程式的 in-target
### chroot 階段執行的,那時候目標系統根本還沒真正開機、rsyslog 也還沒
### 啟動,late-command.sh 的輸出本來就進不了目標系統自己的
### /var/log/syslog——它實際上是被 debian-installer 自己收進安裝程式
### 環境的 log,官方文件說裝完開機後會留一份在目標系統的
### /var/log/installer/(不是 /var/log/syslog)。與其要使用者去猜、
### 去依賴 d-i 這個間接機制,乾脆讓 late-command.sh 自己的輸出明確導向
### 一個固定、可預期的檔案——不管 d-i 那邊的行為以後會不會變,這個
### 檔案一定在。
###
### 第二十三輪(續):把上面那個備援訊息改對之後,使用者馬上就從
### /var/log/installer/syslog 挖出真正的錯誤——
### `in-target: sh: 0: cannot open /cdrom/gonas/late-command.sh: No such
### file or directory`。根本原因是這一行原本的寫法搞錯了 `in-target`
### 的語意:`in-target COMMAND` 是先 chroot 進 /target(剛裝好的目標
### 系統)才執行 COMMAND——這件事本身沒錯,錯在誤以為 `/cdrom` 這個
### 掛載點會「跟著」被 chroot 進去、在 /target 裡面也看得到。Debian
### 官方文件裡看得到的 preseed 範例,凡是要把光碟媒體上的檔案弄進
### /target,寫法都是「不加 in-target 直接 `cp /cdrom/x /target/y`」
### (這裡的 /cdrom 是安裝程式自己環境裡的掛載點,這時候一定還在,
### 是官方保證的時機點),而不是「chroot 進 /target 之後才想從裡面找
### /cdrom」——這兩件事看起來很像,實際上是完全不同的檔案系統視角,
### 在真正的 ESXi 虛擬光碟機上這個差異被踩到了(在 arm64/Parallels
### 那次測試沒踩到,可能只是運氣好或行為剛好沒差,不代表這個假設原本
### 是對的)。修法:把 gonas/ 這個目錄整個複製進 /target 一次(這一步
### 沒有 in-target,在安裝程式自己的環境裡執行,此時 /cdrom 保證還
### 掛著),late-command.sh 之後就從 /target 裡面剛複製好的這份執行,
### 不再依賴 /cdrom 在 chroot 裡看不看得到。
### 第五十七輪:選用套件(samba/mergerfs/…)改由 pkgsel/include 在「安裝基礎
### 系統」階段從 DVD 離線裝好(build-iso.sh 第 4.7 節會把這片 DVD 上真的有的
### 套件動態補進 pkgsel/include)。先前那支在 late_command 自己掛 DVD 當 apt
### 來源的 install-offline-packages.sh 實機證實裝不進去(late_command 階段沒有
### 可用的 apt 來源),已移除。
d-i preseed/late_command string \
    mkdir -p /target/var/lib/gonas-install && \
    cp -a /cdrom/gonas /target/var/lib/gonas-install/gonas && \
    in-target sh -c "GONAS_INSTALL_MEDIA=/var/lib/gonas-install sh /var/lib/gonas-install/gonas/late-command.sh >/var/log/gonas-late-command.log 2>&1" || \
    in-target sh -c "echo 'GoNAS late-command.sh failed (or its files could not be copied onto the target) — see /var/log/gonas-late-command.log (or /var/log/installer/ if that file is missing) on first boot' >> /etc/motd"
